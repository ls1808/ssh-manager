name: Publish beta release

on:
  push:
    branches: [beta]
    paths:
      - version.json
      - src/**
      - scripts/build.ps1
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath 'version.json' -Raw | ConvertFrom-Json
          $value = [string]$metadata.version
          if ($value -notmatch '^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$') {
            throw 'Beta versions must use a prerelease suffix, for example 1.2.0-beta.1.'
          }
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check for an existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.value }}" --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) {
            'exists=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            'exists=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: .\scripts\build.ps1 -Version '${{ steps.version.outputs.value }}' -Channel beta

      - name: Create checksum
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'release\SSH-Manager.exe').Hash.ToLowerInvariant()
          "$hash  SSH-Manager.exe" | Set-Content -LiteralPath 'release\SSH-Manager.exe.sha256' -Encoding ascii

      - name: Publish prerelease
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" `
            'release\SSH-Manager.exe#SSH Manager Beta' `
            'release\SSH-Manager.exe.sha256#SHA-256 checksum' `
            --target '${{ github.sha }}' `
            --title "SSH Manager ${{ steps.version.outputs.value }}" `
            --generate-notes `
            --prerelease

