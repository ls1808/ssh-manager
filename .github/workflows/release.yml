name: Publish SSH Manager

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, for example 1.2.0 or 1.3.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate channel and version
        shell: pwsh
        run: |
          $branch = '${{ github.ref_name }}'
          $version = '${{ inputs.version }}'
          if ($branch -notin @('main', 'beta')) { throw 'Releases may only be published from main or beta.' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Version must use semantic version format.' }
          if ($branch -eq 'main' -and $version.Contains('-')) { throw 'The main branch only publishes stable versions.' }
          if ($branch -eq 'beta' -and -not $version.Contains('-')) { throw 'The beta branch version must include a prerelease suffix.' }

      - name: Build standalone executable
        shell: pwsh
        run: .\scripts\build.ps1 -Version '${{ inputs.version }}' -Channel '${{ github.ref_name }}'

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'release\SSH-Manager.exe').Hash.ToLowerInvariant()
          "$hash  SSH-Manager.exe" | Set-Content -LiteralPath 'release\SSH-Manager.exe.sha256' -Encoding ascii

      - name: Publish stable release
        if: github.ref_name == 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" `
            'release\SSH-Manager.exe#SSH Manager' `
            'release\SSH-Manager.exe.sha256#SHA-256 checksum' `
            --target '${{ github.ref_name }}' `
            --title "SSH Manager ${{ inputs.version }}" `
            --generate-notes

      - name: Publish beta prerelease
        if: github.ref_name == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" `
            'release\SSH-Manager.exe#SSH Manager Beta' `
            'release\SSH-Manager.exe.sha256#SHA-256 checksum' `
            --target '${{ github.ref_name }}' `
            --title "SSH Manager ${{ inputs.version }}" `
            --generate-notes `
            --prerelease

