name: Publish beta release

on:
  push:
    branches: [beta]
    paths:
      - version.json
      - src/**
      - scripts/build.ps1
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath 'version.json' -Raw | ConvertFrom-Json
          $value = [string]$metadata.version
          if ($value -notmatch '^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$') {
            throw 'Beta versions must use a prerelease suffix, for example 1.2.0-beta.1.'
          }
          $title = [string]$metadata.releaseTitle
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = "SSH Manager $value"
          }
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check for an existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --repo '${{ github.repository }}' --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the repository release list.'
          }
          $exists = $tags -contains 'v${{ steps.version.outputs.value }}'
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: .\scripts\build.ps1 -Version '${{ steps.version.outputs.value }}' -Channel beta

      - name: Create checksum
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath 'release\SSH-Manager.exe').Hash.ToLowerInvariant()
          "$hash  SSH-Manager.exe" | Set-Content -LiteralPath 'release\SSH-Manager.exe.sha256' -Encoding ascii

      - name: Publish prerelease
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" `
            'release\SSH-Manager.exe#SSH Manager-beta-1.0' `
            'release\SSH-Manager.exe.sha256#SHA-256 checksum' `
            --target '${{ github.sha }}' `
            --title '${{ steps.version.outputs.title }}' `
            --generate-notes `
            --prerelease
