name: Publish beta release

on:
  push:
    branches: [beta]
    paths:
      - version.json
      - src/**
      - scripts/build.ps1
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content -LiteralPath 'version.json' -Raw | ConvertFrom-Json
          $value = [string]$metadata.version
          if ($value -notmatch '^beta-\d+\.\d+(?:\.\d+)?$') {
            throw 'Public beta versions must use the beta-1.0 format.'
          }
          $title = "SSH Manager-$value"
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check for an existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --repo '${{ github.repository }}' --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the repository release list.'
          }
          $exists = $tags -contains '${{ steps.version.outputs.value }}'
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Version '${{ steps.version.outputs.value }}' -Channel beta -Output 'release\SSH-Manager.exe'

      - name: Create checksum
        shell: pwsh
        run: |
          $asset = 'SSH-Manager.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "release\$asset").Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -LiteralPath "release\$asset.sha256" -Encoding ascii

      - name: Publish beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ steps.release.outputs.exists }}' -eq 'true') {
            gh release delete '${{ steps.version.outputs.value }}' --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the existing beta release.' }
          }
          gh release create '${{ steps.version.outputs.value }}' `
            'release\SSH-Manager.exe#SSH Manager' `
            'release\SSH-Manager.exe.sha256#SHA-256 checksum' `
            --target '${{ github.sha }}' `
            --title '${{ steps.version.outputs.title }}' `
            --notes 'Public beta of SSH Manager. Includes embedded tabbed terminals, saved SSH and SFTP profiles, the Linux command reference, and automatic SHA-256 verified updates.' `
            --latest
